# 桌面客户端（Electron）发布流水线
#
# 触发方式：推送形如 v0.1.0 的 tag
#   git tag v0.1.0 && git push origin v0.1.0
# 产物：Windows x64 NSIS 安装包(.exe)，自动挂到该 tag 对应的 GitHub Release 资产中
#
# macOS dmg 改为本地构建（GitHub 免费 mac runner 排队过久）：
#   在 Mac 上 git checkout <tag> && npm install && npm run dist:mac
#   产物在 release/*.dmg，直接发给使用者或手动上传到 Release 附件
#
# 签名：当前未配置任何 Secrets，产出未签名包。
# 以后配置签名时，只需在仓库 Settings → Secrets and variables → Actions 添加：
#   Windows（云签名，如 Azure Trusted Signing）：AZURE_TENANT_ID / AZURE_CLIENT_ID /
#            AZURE_CLIENT_SECRET / AZURE_CODE_SIGNING_ACCOUNT_NAME / AZURE_CODE_SIGNING_ENDPOINT
# 届时 electron-builder 会自动识别并签名，无需改本文件。

name: Release Desktop (Electron)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop bundle
        run: npm run build:desktop

      - name: Package Windows installer
        shell: bash
        run: |
          set +e
          npx electron-builder --win --x64 > builder.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              echo '## electron-builder (win) failed'
              echo '```'
              tail -100 builder.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi

      - name: Upload installer to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
